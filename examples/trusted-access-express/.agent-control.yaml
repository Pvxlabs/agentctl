project: trusted-access-express
audiences:
  dev:
    base_url: http://127.0.0.1:3000
    audience: trusted-access-express-dev
actions:
  health.read:
    method: GET
    path: /health
    scope: app:read
    audience: dev
trusted_access:
  enabled: true
  environment: dev
  transports:
    - localhost
    - tailscale
  application:
    identity: trusted-access-express
    audience: trusted-access-express-dev
  adapter:
    type: declarative_mapping
    mappings:
      dev-user: express-dev-user
      dev-admin: express-dev-admin
      dev-agent: express-dev-agent
  principals:
    user:
      subject: dev-user
      type: human
      scopes:
        - app:read
    admin:
      subject: dev-admin
      type: human
      scopes:
        - app:read
        - app:admin
    agent:
      subject: dev-agent
      type: agent
      scopes:
        - app:read
        - app:test
